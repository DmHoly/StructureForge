[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structureforge"
dynamic = ["version"]
description = "2D cross-section process simulator: draw device structures from elementary deposition/etch/planarization/chemical steps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
follow = [
    "follow @ git+https://github.com/DmHoly/Follow.git",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "httpx>=0.27",
]

[project.scripts]
structureforge = "structureforge.api.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "structureforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["structureforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
